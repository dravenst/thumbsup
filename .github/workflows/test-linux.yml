name: Test on Linux

on:
  workflow_dispatch:
  push:
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.test
          build-args: |
            NODE_VERSION=${{ matrix.node }}
          push: false
